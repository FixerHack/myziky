<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MooЗики</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Moo2';
      src: url('site_elements/Moo2-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --cream:   #EEF4FA;
      --ink:     #472819;
      --red:     #D96C38;
      --bg:      #76B9D5;
      --bg-dark: #4A7BA6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }

    /* ══════ NAV ══════ */
    .topnav {
      background: var(--red);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 32px 16px;
    }

    .nav-logo img {
      height: 72px;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      margin-top: 8px;
    }

    .nav-links a {
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: var(--ink);
      text-decoration: none;
      opacity: 0.75;
      transition: opacity 0.25s;
      letter-spacing: 0.04em;
    }
    .nav-links a:hover { opacity: 1; }

    .nav-links .merch-link {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-links .merch-link img {
      width: 22px;
    }

    /* ══════ HERO ══════ */
    #dim {
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }

    .hero-img {
      width: 100%;
      display: block;
      max-height: 58vh;
      object-fit: cover;
      object-position: center 30%;
    }

    /* ══════ КЛІП ══════ */
    #klip {
      background: var(--bg);
      padding: 56px 40px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .sec-title {
      font-family: 'Moo2', sans-serif;
      font-size: clamp(42px, 6vw, 74px);
      color: var(--ink);
      line-height: 1;
    }

    .video-wrap {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      position: relative;
      background: rgba(44,80,115,0.35);
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .vid-ph {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .vid-ph img {
      width: 80px;
      transition: transform 0.2s, opacity 0.2s;
      opacity: 0.9;
    }
    .vid-ph:hover img {
      transform: scale(1.1);
      opacity: 1;
    }

    /* ══════ СЛУХАТИ ══════ */
    #muzyka {
      background: var(--bg);
      padding: 56px 60px 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .player-container {
      display: flex;
      gap: 52px;
      align-items: flex-start;
      width: 100%;
      max-width: 900px;
    }

    .album-cover {
      width: 450px;
      height: 450px;
      flex-shrink: 0;
      overflow: hidden;
      background: rgba(44,80,115,0.3);
    }
    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .player-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* top row: кнопка + назва + час */
    .player-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .play-btn {
      width: 64px;       /* ← ширина зони кліку (не впливає на зображення) */
      height: 64px;      /* ← висота зони кліку */
      flex-shrink: 0;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      position: relative;
      display: block;
      overflow: visible; /* ← дозволяє зображенням виходити за межі кнопки */
    }
    /* ── music2.png: оранжева текстура — міняй top/left/width/height вільно ── */
    .play-btn .play-bg {
      position: absolute;
      top: -195px;      /* ← вгору/вниз */
      left: -160px;     /* ← ліво/право */
      width: 512px;   /* ← ширина */
      height: 512px;  /* ← висота */
      object-fit: fill;
      display: block;
    }
    /* ── music1.png: іконка плей — міняй top/left/width/height вільно ── */
    .play-btn .play-icon {
      position: absolute;
      top: -195px;     /* ← вгору/вниз */
      left: -280px;    /* ← ліво/право */
      width: 512px;   /* ← ширина */
      height: 512px;  /* ← висота */
      object-fit: contain;
      display: block;
      z-index: 1;
    }

    .track-name {
      font-family: 'Roboto', sans-serif;
      font-size: 17px;
      font-weight: 500;
      color: var(--ink);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-time {
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      color: var(--ink);
      opacity: 0.65;
      flex-shrink: 0;
    }

    /* progress bar */
    .progress-wrap {
      height: 8px;
      background: rgba(30,55,90,0.35);
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--red);
      border-radius: 4px;
      width: 0%;
      transition: width 0.1s linear;
      pointer-events: none;
    }

    /* tracklist з текстурою — всі компоненти незалежні */
    .tracklist-wrap {
      position: relative;
      height: 320px; /* ← висота контейнера, міняй вільно */
    }

    /* ── ФОН: повністю незалежний ── */
    .tracklist-bg-wrap {
      position: absolute;
      top: -30px;    /* ← позиція фону: вгору/вниз */
      left: -95px;   /* ← позиція фону: ліво/право */
      width: 700px;  /* ← ширина фону */
      height: 400px; /* ← висота фону */
      pointer-events: none;
      user-select: none;
    }
    .tracklist-bg-wrap img {
      position: absolute;
      object-fit: fill;
      display: block;
    }
    /* ── БЕК 1: міняй top/left/width/height вільно ── */
    .tracklist-bg-wrap img:nth-child(1) {
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    /* ── БЕК 2: міняй top/left/width/height вільно ── */
    .tracklist-bg-wrap img:nth-child(2) {
      top: 15px;
      left: 20px;
      width: 100%;
      height: 100%;
    }

    /* ── КОНТЕНТ: повністю незалежний ── */
    .tracklist-content {
      position: absolute;
      top: 10px;    /* ← позиція контенту: вгору/вниз */
      left: 10px;   /* ← позиція контенту: ліво/право */
      z-index: 2;
      padding: 14px 16px;
    }

    /* ── НАЗВА ЕР: незалежна ── */
    .ep-title {
      font-family: 'Moo2', sans-serif;
      font-size: 30px;   /* ← розмір */
      color: #fff;
      margin-bottom: 8px; /* ← відступ до треків */
      letter-spacing: 0.04em;
    }

    /* ── СПИСОК ТРЕКІВ — контейнер ── */
    #tracklist {
      position: relative;
      height: 280px; /* ← висота всього списку, міняй вільно */
    }

    /* ── КОЖЕН ТРЕК: абсолютний, незалежний ── */
    .track-item {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 10px;
      left: 0;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .track-item:hover { opacity: 0.7; }

    /* ── ПОЗИЦІЯ КОЖНОГО ТРЕКУ (міняй top вільно) ── */
    .track-item:nth-child(1) { top: 0px; }
    .track-item:nth-child(2) { top: 50px; }
    .track-item:nth-child(3) { top: 100px; }
    .track-item:nth-child(4) { top: 150px; }
    .track-item:nth-child(5) { top: 200px; }

    /* ── ІКОНКА: незалежна ── */
    .track-icon {
      width: 96px;   /* ← розмір іконки */
      height: 96px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* ── ПОДВІЙНА ІКОНКА (play2 × 2) ── */
    .track-icon-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }
    .track-icon-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── НАЗВА ТРЕКУ ── */
    .track-item-name {
      font-family: 'Roboto', sans-serif;
      font-size: 15px;
      color: #fff;
      font-weight: 400;
      white-space: nowrap;
    }

    /* ══════ СПІЛЬНІ ФОТО ══════ */
    #foto {
      background: var(--bg);
      padding: 56px 0 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      overflow: hidden;
    }

    .gallery-strip-wrap {
      position: relative;
      width: 100%;
    }

    /* ── ФОН смуги: orange_photo.png ── */
    .gallery-strip-bg {
      position: absolute;
      top: -210px;             /* ← підняти вгору (міняй цю цифру) */
      left: 0;
      width: 100%;
      height: calc(100% + 280px); /* ← top + скільки знизу */
      object-fit: fill;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* ── Горизонтальний скрол ── */
    .gallery-scroll {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 36px 60px 80px; /* ← останнє число: пуста зона знизу */
      scrollbar-width: none;
      cursor: grab;
    }
    .gallery-scroll:active { cursor: grabbing; }
    .gallery-scroll::-webkit-scrollbar { display: none; }

    /* ── Кожне фото ── */
    .gallery-scroll img {
      width: 220px;   /* ← ширина фото */
      height: 220px;  /* ← висота фото */
      object-fit: cover;
      flex-shrink: 0;
      display: block;
    }

    /* ══════ МЕРЧ ══════ */
    #merch {
      background: var(--bg);
      padding: 20px 0 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      position: relative;
      overflow: hidden;
    }

    /* нахилений елемент зліва */
    .merch-tilt {
      position: absolute;
      top: 50%;
      left: -60px;
      transform: translateY(-50%) rotate(-12deg);
      width: 220px;
      pointer-events: none;
    }
    .merch-tilt img {
      width: 100%;
      display: block;
    }

    /* контейнер карток — фіксована висота, всі картки абсолютні */
    .merch-grid {
      position: relative;
      width: 100%;
      height: 800px; /* ← висота зони карток — має відповідати висоті .merch-card */
      margin-top: -130px; /* ← підтягує картки вгору до надпису */
    }

    /* ── КОЖНА КАРТКА: абсолютна, незалежна ── */
    .merch-card {
      position: absolute;
      width: 600px;   /* ← ширина картки */
      height: 800px;  /* ← висота картки */
      cursor: pointer;
      transition: transform 0.2s;
    }
    .merch-card:hover { transform: scale(1.04); }

    /* ── ПОЗИЦІЯ КОЖНОЇ КАРТКИ (міняй left/top вільно) ── */
    .merch-card:nth-child(1) { left: 500px;  top: 0px; }
    .merch-card:nth-child(2) { left: 900px; top: 0px; }
    .merch-card:nth-child(3) { left: 1300px; top: 0px; }
    .merch-card:nth-child(4) { left: 1700px; top: 0px; }

    .merch-card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
    .merch-card-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .merch-card-img {
      width: 100%;
      height: 130px;
      object-fit: contain;
    }
    .merch-card-name {
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      text-align: center;
      margin-top: 8px;
    }

    /* ══════ MOBILE ══════ */
    @media (max-width: 700px) {
      .merch-grid {
        flex-wrap: wrap;  /* ← на мобільному дозволяємо перенос */
        padding: 0 16px;
      }
      .merch-card {
        min-width: calc(50% - 10px); /* ← 2 картки в ряд */
        max-width: calc(50% - 10px);
      }
      .nav-links { gap: 18px; }
      .nav-links a { font-size: 14px; }
      #klip { padding: 40px 16px 48px; }
      #muzyka { padding: 40px 16px 48px; }
      .player-container { flex-direction: column; gap: 24px; }
      .album-cover { width: 100%; height: 240px; }
    }
  </style>
</head>
<body>

<!-- ══ NAV ══ -->
<header class="topnav">
  <div class="nav-logo">
    <img src="site_elements/logo_muzuku.png" alt="MooЗики">
  </div>
  <nav class="nav-links">
    <a href="#dim">дім</a>
    <a href="#klip">кліп</a>
    <a href="#muzyka">музика</a>

<!-- ══ HERO ══ -->
<section id="dim">

</section>

<!-- ══ КЛІП ══ -->

  <div class="player-container">

<script>
  /* ══ VIDEO ══ */
  const VID = 'tkVEb5-R2w0';
  function loadVideo() {
    const ph = document.getElementById('vidPh');
    const f = document.createElement('iframe');
    f.src = `https://www.youtube.com/embed/${VID}?autoplay=1`;
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    f.allowFullscreen = true;
    ph.parentNode.replaceChild(f, ph);
  }

  /* ══ PLAYER ══ */
  const TRACKS = [
    { name: 'Інтро',          file: 'music/intro.mp3' },
    { name: 'Балконний гном', file: 'music/balkonygnom.mp3' },
    { name: 'Подивись',       file: 'music/podivis.mp3' },
    { name: 'Пацантре',       file: 'music/pacantre.mp3' },
    { name: 'Пий чай',        file: 'music/puychay.mp3' },
  ];

  let apIdx = 1, apPlaying = false;
  const apAudio = new Audio();
  const fmtT = s => (!s || isNaN(s)) ? '0:00'
    : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

  /* іконки чергуються фіксовано: play1, play2, play1, play2, play1 */
  const TRACK_ICONS = ['play1','play2','play1','play2','play1'];

  function buildTracklist() {
    document.getElementById('tracklist').innerHTML = TRACKS.map((t, i) => {
      const icon = TRACK_ICONS[i];
      const iconHtml = icon === 'play2'
        ? `<div class="track-icon-wrap">
             <img src="site_elements/play2.png" alt="">
             <img src="site_elements/play2.png" alt="">
           </div>`
        : `<img class="track-icon" src="site_elements/${icon}.png" alt="">`;
      return `
      <div class="track-item" onclick="apLoad(${i})">
        ${iconHtml}
        <span class="track-item-name">${t.name}</span>
      </div>`;
    }).join('');
  }

  function apLoad(idx) {
    apIdx = idx;
    apAudio.src = TRACKS[idx].file;
    apAudio.load();
    document.getElementById('trackName').textContent = TRACKS[idx].name;
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('trackTime').textContent = '0:00/0:00';
    if (apPlaying) apAudio.play().catch(() => {});
  }

  function apToggle() {
    if (!apAudio.src || apAudio.src === window.location.href)
      apAudio.src = TRACKS[apIdx].file;
    apPlaying = !apPlaying;
    apPlaying ? apAudio.play().catch(() => {}) : apAudio.pause();
  }

  function apSeek(e) {
    const r = document.getElementById('progressWrap').getBoundingClientRect();
    if (!isNaN(apAudio.duration))
      apAudio.currentTime = Math.max(0, Math.min((e.clientX - r.left) / r.width, 1)) * apAudio.duration;
  }

  apAudio.ontimeupdate = () => {
    document.getElementById('progressFill').style.width =
      (apAudio.currentTime / (apAudio.duration || 1) * 100) + '%';
    document.getElementById('trackTime').textContent =
      `${fmtT(apAudio.currentTime)}/${fmtT(apAudio.duration)}`;
  };
  apAudio.onended = () => {
    apPlaying = false;
    document.getElementById('playBtnImg').src = 'site_elements/play1.png';
    if (apIdx < TRACKS.length - 1) apLoad(apIdx + 1);
  };
  apAudio.onloadedmetadata = () => {
    document.getElementById('trackTime').textContent = `0:00/${fmtT(apAudio.duration)}`;
  };

  buildTracklist();

  /* ══ GALLERY AUTO + DRAG SCROLL ══ */
  const gs = document.getElementById('galleryScroll');
  let isDragging = false, isHovered = false, startX, dragStart;
  const speed = 1; /* ← швидкість авто-скролу (px за кадр) */

  /* авто-скрол */
  function autoScroll() {
    if (!isDragging && !isHovered) {
      gs.scrollLeft += speed;
      if (gs.scrollLeft >= gs.scrollWidth - gs.clientWidth)
        gs.scrollLeft = 0; /* повернутись на початок */
    }
    requestAnimationFrame(autoScroll);
  }
  autoScroll();

  /* зупинка при наведенні */
  gs.addEventListener('mouseenter', () => isHovered = true);
  gs.addEventListener('mouseleave', () => { isHovered = false; isDragging = false; });

  /* drag */
  gs.addEventListener('mousedown', e => {
    isDragging = true;
    startX = e.pageX - gs.offsetLeft;
    dragStart = gs.scrollLeft;
  });
  gs.addEventListener('mouseup', () => isDragging = false);
  gs.addEventListener('mousemove', e => {
    if (!isDragging) return;
    e.preventDefault();
    gs.scrollLeft = dragStart - (e.pageX - gs.offsetLeft - startX);
  });
</script>

</body>
</html>
